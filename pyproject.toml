[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-sentinel"
version = "0.1.0"
description = "Release-readiness checks for open-source maintainers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "maintainer-sentinel" }
]
keywords = ["open-source", "release", "maintenance", "github-actions", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
release-sentinel = "release_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
