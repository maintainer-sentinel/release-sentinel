name: Feature request
description: Propose a new release-readiness check or workflow improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: What release or maintenance failure should this prevent?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Release Sentinel check or report?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example repositories or layouts
      description: Share public examples only.
    validations:
      required: false
