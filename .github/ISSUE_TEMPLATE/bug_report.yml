name: Bug report
description: Report a reproducible Release Sentinel problem.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include a minimal repository layout or command output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release Sentinel version or commit SHA.
    validations:
      required: true
